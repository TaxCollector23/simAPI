services:
  - type: web
    name: simapi-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT --workers ${SIMAPI_WORKERS:-1}
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SIMAPI_ENV
        value: production
      - key: SIMAPI_WORKERS
        value: "1"
    plan: free
  - type: web
    name: simapi-mcp
    runtime: python
    buildCommand: pip install -r requirements-mcp.txt
    startCommand: sh scripts/start_render_mcp.sh
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SIMAPI_MCP_API_KEYS
        generateValue: true
      - key: SIMAPI_MCP_RATE_LIMIT
        value: "60"
    plan: free
