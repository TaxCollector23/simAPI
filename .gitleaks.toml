title = "SimAPI Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "The legacy benchmark env-var name is non-secret and only occurs in its source file."
condition = "AND"
regexTarget = "secret"
regexes = ['''SIMAPI_TRAJECTORY_BASELINE''']
paths = ['''^benchmark/robotics_trajectory_benchmark\.py$''']
